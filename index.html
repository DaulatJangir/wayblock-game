<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restoring Way Block</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #070d19;
      color: #f8fafc;
      font-family: Arial, sans-serif;
    }
    body {
      display: grid;
      place-items: center;
    }
    .restore-box {
      text-align: center;
      padding: 24px 30px;
      background: #0e172a;
      border: 1px solid #1e2d4d;
      border-radius: 16px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.28);
    }
    .title {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
      color: #00d2ff;
    }
    .msg {
      font-size: 0.82rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="restore-box">
    <div class="title">RESTORING</div>
    <div class="msg">Loading the known-good game build...</div>
  </div>

  <script>
    (async function restoreKnownGoodVersion() {
      const url = 'https://raw.githubusercontent.com/DaulatJangir/wayblock-game/ef96f05b551798443bdfe0671359de331a598a1e/index.html';
      try {
        const response = await fetch(url, { cache: 'no-store' });
        if (!response.ok) {
          throw new Error('Failed to load known-good build');
        }
        const html = await response.text();
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.body.innerHTML = '<div style="display:grid;place-items:center;height:100vh;background:#070d19;color:#f8fafc;font-family:Arial,sans-serif"><div style="padding:24px 28px;border:1px solid #ef4444;border-radius:16px;background:#0e172a;color:#f8fafc;text-align:center"><div style="font-weight:800;letter-spacing:0.08em;color:#ef4444;margin-bottom:8px">RESTORE FAILED</div><div style="font-size:0.8rem;color:#94a3b8">The known-good build could not be loaded. Please check the GitHub commit reference.</div></div></div>';
      }
    })();
  </script>
</body>
</html>
