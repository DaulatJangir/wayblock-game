name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Scaffold App with Capacitor 6
        run: |
          mkdir -p www
          cp index.html www/
          npm init -y
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0
          npx cap init "Way Block" "com.cyberarena.wayblock" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Configure Android permissions and minimum version
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/variables.gradle")
          if p.exists():
              s = p.read_text()
              s = s.replace("minSdkVersion = 22", "minSdkVersion = 23")
              p.write_text(s)
          p = Path("android/app/build.gradle")
          s = p.read_text()
          s = s.replace("versionCode 1", "versionCode ${{ github.run_number }}")
          s = s.replace('versionName "1.0"', 'versionName "1.0.${{ github.run_number }}"')
          p.write_text(s)
          PY
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK signature and package metadata
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -n "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.cyberarena.wayblock'" apk-badging.txt
          cp "$APK" WayBlock-Game.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WayBlock-Game-APK
          path: WayBlock-Game.apk
          if-no-files-found: error
          retention-days: 90
