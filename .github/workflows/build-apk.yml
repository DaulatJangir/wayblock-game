name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Scaffold App with Capacitor 6
        run: |
          mkdir -p www
          cp index.html www/
          npm init -y
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0
          npx cap init "Way Block" "com.cyberarena.wayblock" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Configure Android permissions and versioning
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          # 1. Safely add permissions to AndroidManifest.xml
          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          tree = ET.parse(manifest_path)
          root = tree.getroot()

          permissions = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE"
          ]
          for perm in permissions:
              elem = ET.Element("uses-permission", {"{http://schemas.android.com/apk/res/android}name": perm})
              root.insert(0, elem)

          tree.write(manifest_path, encoding="utf-8", xml_declaration=True)

          # 2. Update versionCode and versionName
          p = Path("android/app/build.gradle")
          s = p.read_text()
          s = s.replace("versionCode 1", "versionCode ${{ github.run_number }}")
          s = s.replace('versionName "1.0"', 'versionName "1.0.${{ github.run_number }}"')
          p.write_text(s)
          PY

          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Output APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK" WayBlock-Game.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WayBlock-Game-APK
          path: WayBlock-Game.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with direct APK download
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "WayBlock Build v1.0.${{ github.run_number }}"
          files: WayBlock-Game.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
