name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Scaffold App with Capacitor 6
        run: |
          mkdir -p www
          cp index.html www/
          npm init -y
          npm install @capacitor/core@6.0.0 @capacitor/cli@6.0.0 @capacitor/android@6.0.0
          npx cap init "Way Block" "com.cyberarena.wayblock" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Configure Keystore, Permissions, and Manifest
        run: |
          # 1. Create a standard Android debug keystore on the runner
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

          # 2. Inject permissions & verify exported="true" in AndroidManifest.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          tree = ET.parse(manifest_path)
          root = tree.getroot()

          # Add permissions
          for perm in ["android.permission.INTERNET", "android.permission.ACCESS_NETWORK_STATE"]:
              elem = ET.Element("uses-permission", {"{http://schemas.android.com/apk/res/android}name": perm})
              root.insert(0, elem)

          # Ensure MainActivity has android:exported="true"
          app = root.find('application')
          if app is not None:
              for activity in app.findall('activity'):
                  activity.set('{http://schemas.android.com/apk/res/android}exported', 'true')

          tree.write(manifest_path, encoding="utf-8", xml_declaration=True)

          # 3. Update build.gradle versions and debug signing config
          p = Path("android/app/build.gradle")
          s = p.read_text()
          s = s.replace("versionCode 1", "versionCode ${{ github.run_number }}")
          s = s.replace('versionName "1.0"', 'versionName "1.0.${{ github.run_number }}"')
          p.write_text(s)
          PY

      - name: Build and Sign APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Align and Verify Signed APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          
          # Verify V1 & V2 signatures
          "$APKSIGNER" verify --verbose "$APK"
          
          cp "$APK" WayBlock-Game.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WayBlock-Game-APK
          path: WayBlock-Game.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "WayBlock Build v1.0.${{ github.run_number }}"
          files: WayBlock-Game.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
