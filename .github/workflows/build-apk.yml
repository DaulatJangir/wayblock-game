name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Scaffold App with Capacitor 6
        run: |
          mkdir -p www/assets
          cp index.html www/
          cp -r assets/. www/assets/
          npm init -y
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0
          npx cap init "Way Block" "com.cyberarena.wayblock" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Add Android Network Permissions
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' android/app/src/main/AndroidManifest.xml

      - name: Auto-Increment Version Code & Fix Kotlin Resolution
        run: |
          # 1. Dynamically bump versionCode using GitHub run number so updates overwrite cleanly
          sed -i 's/versionCode 1/versionCode '${{ github.run_number }}'/g' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.0.'${{ github.run_number }}'"/g' android/app/build.gradle

          # 2. Exclude conflicting legacy Kotlin stdlib modules
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WayBlock-Game-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
